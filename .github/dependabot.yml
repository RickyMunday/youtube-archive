# Dependabot configuration for https://github.com/RickyMunday/youtube-archive
# See documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci/cd"
    assignees:
      - "RickyMunday"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
