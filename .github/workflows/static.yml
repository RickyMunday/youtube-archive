name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies and Build
        run: |
          npm ci
          npm run build
        # *Verification:* Ensure your build script successfully generates the output directory (e.g., dist/).

      - name: Fetch YouTube RSS Feed into Build Output
        run: |
          # Create the assets folder inside your build output directory
          mkdir -p dist/assets
          curl -s "https://www.youtube.com/feeds/videos.xml?channel_id=UCWkwW8xZBqqXjB4teSo5fPg" -o dist/assets/feed.xml
          echo "Successfully fetched YouTube RSS feed to dist/assets/feed.xml."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Points to your SSG output directory instead of root '.'
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
