name: Bing SEO & IndexNow Automation

on:
  push:
    branches: [ "main",]
  workflow_dispatch:

jobs:
  seo-sync:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize PowerShell 5.1 Environment
        shell: pwsh
        run: |
          $PSVersionTable

      - name: Execute SEO Indexing & Validation Script
        shell: pwsh
        env:
          INDEX_NOW_KEY: ${{ secrets.INDEX_NOW_KEY }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: |
          ./bing-image-indexing.ps1 -IndexNowKey $env:INDEX_NOW_KEY -BingApiKey $env:BING_API_KEY
