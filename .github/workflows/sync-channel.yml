name: Sync @RickyMunday (UCWkwW8xZBqqXjB4teSo5fPg) Broadcasts

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/sync-channel.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-channel:
    name: Poll Atom Feed, Archive Thumbnails & Build Sitemaps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch UCWkwW8xZBqqXjB4teSo5fPg Feed & Build Artifacts
        run: |
          python3 - << 'EOF'
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from xml.sax.saxutils import escape

          CHANNEL_ID = "UCWkwW8xZBqqXjB4teSo5fPg"
          CHANNEL_HANDLE = "@RickyMunday"
          REPO_SLUG = "RickyMunday/youtube-archive"
          FEED_URL = f"https://www.youtube.com/feeds/videos.xml?channel_id={CHANNEL_ID}"

          THUMB_DIR = Path("thumbnails")
          FEEDS_DIR = Path("feeds")
          THUMB_DIR.mkdir(parents=True, exist_ok=True)
          FEEDS_DIR.mkdir(parents=True, exist_ok=True)

          JSONLD_FILE = FEEDS_DIR / "youtube-videos.jsonld"
          SITEMAP_FILE = FEEDS_DIR / "sitemap-video.xml"
          RAW_FEED_FILE = FEEDS_DIR / "channel-rss.xml"

          HEADERS = {"User-Agent": "Mozilla/5.0 (compatible; RickyMundayArchiver/1.0; +https://www.rickylpinzon.us)"}

          def download_thumbnail(video_id, dest_path):
              if dest_path.exists() and dest_path.stat().st_size > 1024:
                  return True
              for res in ["maxresdefault.jpg", "sddefault.jpg", "hqdefault.jpg"]:
                  url = f"https://i.ytimg.com/vi/{video_id}/{res}"
                  try:
                      req = urllib.request.Request(url, headers=HEADERS)
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          data = resp.read()
                          if resp.status == 200 and len(data) > 1024:
                              dest_path.write_bytes(data)
                              return True
                  except Exception:
                      continue
              return False

          existing_videos = {}
          if JSONLD_FILE.exists():
              try:
                  data = json.loads(JSONLD_FILE.read_text(encoding="utf-8"))
                  for node in data.get("@graph", []):
                      if node.get("@type") == "VideoObject" and node.get("identifier"):
                          existing_videos[node["identifier"]] = node
              except Exception:
                  pass

          req = urllib.request.Request(FEED_URL, headers=HEADERS)
          with urllib.request.urlopen(req, timeout=20) as resp:
              xml_bytes = resp.read()
          RAW_FEED_FILE.write_bytes(xml_bytes)

          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015",
              "media": "http://search.yahoo.com/mrss/"
          }
          root = ET.fromstring(xml_bytes)

          for entry in root.findall("atom:entry", ns):
              vid_el = entry.find("yt:videoId", ns)
              if vid_el is None or not vid_el.text:
                  continue
              video_id = vid_el.text.strip()
              title = entry.find("atom:title", ns).text.strip()
              published = entry.find("atom:published", ns).text.strip()
              updated = entry.find("atom:updated", ns).text.strip()
              media_group = entry.find("media:group", ns)
              desc_el = media_group.find("media:description", ns) if media_group is not None else None
              description = desc_el.text.strip() if (desc_el is not None and desc_el.text) else f"Broadcast by Ricky Lee Pinzon ({CHANNEL_HANDLE})"

              date_prefix = published[:10]
              thumb_name = f"{date_prefix}-{video_id}.jpg"
              download_thumbnail(video_id, THUMB_DIR / thumb_name)

              cdn_thumb = f"https://cdn.jsdelivr.net/gh/{REPO_SLUG}@main/thumbnails/{thumb_name}"

              existing_videos[video_id] = {
                  "@type": "VideoObject",
                  "@id": f"https://www.rickylpinzon.us/#video-{video_id}",
                  "identifier": video_id,
                  "name": title,
                  "description": description[:1000],
                  "uploadDate": published,
                  "dateModified": updated,
                  "url": f"https://www.youtube.com/watch?v={video_id}",
                  "embedUrl": f"https://www.youtube.com/embed/{video_id}",
                  "thumbnailUrl": [
                      cdn_thumb,
                      f"https://i.ytimg.com/vi/{video_id}/hqdefault.jpg"
                  ],
                  "author": {"@id": "https://www.rickylpinzon.us/#person"},
                  "publisher": {"@id": "https://www.rickylpinzon.us/#organization"}
              }

          sorted_list = sorted(existing_videos.values(), key=lambda v: v["uploadDate"], reverse=True)

          jsonld_payload = {
              "@context": "https://schema.org",
              "@graph": [
                  {
                      "@type": "Person",
                      "@id": "https://www.rickylpinzon.us/#person",
                      "name": "Ricky Lee Pinzon",
                      "alternateName": ["Ricky L. Pinzon", "Ricky Munday"],
                      "url": "https://www.rickylpinzon.us",
                      "sameAs": [
                          "https://www.rickylpinzon.com",
                          "https://www.rickylpinzon.us",
                          f"https://www.youtube.com/channel/{CHANNEL_ID}",
                          "https://www.youtube.com/@RickyMunday"
                      ]
                  },
                  {
                      "@type": "Organization",
                      "@id": "https://www.rickylpinzon.us/#organization",
                      "name": "Power in Chamber Inc.",
                      "identifier": "CA SOS Entity #52486752",
                      "url": "https://www.rickylpinzon.us"
                  },
                  *sorted_list
              ]
          }
          JSONLD_FILE.write_text(json.dumps(jsonld_payload, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          sitemap_lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"',
              '        xmlns:video="http://www.google.com/schemas/sitemap-video/1.1">'
          ]
          for v in sorted_list:
              vid = v["identifier"]
              sitemap_lines.extend([
                  '  <url>',
                  '    <loc>https://www.rickylpinzon.us/</loc>',
                  '    <video:video>',
                  f'      <video:thumbnail_loc>{escape(v["thumbnailUrl"][0])}</video:thumbnail_loc>',
                  f'      <video:title>{escape(v["name"])}</video:title>',
                  f'      <video:description>{escape(v["description"][:2048])}</video:description>',
                  f'      <video:player_loc>https://www.youtube.com/embed/{vid}</video:player_loc>',
                  f'      <video:publication_date>{v["uploadDate"]}</video:publication_date>',
                  '      <video:family_friendly>yes</video:family_friendly>',
                  '      <video:uploader info="https://www.rickylpinzon.us">Ricky Lee Pinzon (Ricky Munday)</video:uploader>',
                  '    </video:video>',
                  '  </url>'
              ])
          sitemap_lines.append('</urlset>\n')
          SITEMAP_FILE.write_text("\n".join(sitemap_lines), encoding="utf-8")
          EOF

      - name: Update SHA256SUMS.txt Ledger
        run: |
          find thumbnails feeds transcripts -type f 2>/dev/null | LC_ALL=C sort | xargs -r sha256sum > SHA256SUMS.txt

      - name: Commit & Push Archived Broadcasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbnails/ feeds/ SHA256SUMS.txt
          if git diff --staged --quiet; then
            echo "No new broadcasts detected."
          else
            git commit -m "chore(archive): sync @RickyMunday (UCWkwW8xZBqqXjB4teSo5fPg) broadcasts [skip ci]"
            git push
          fi